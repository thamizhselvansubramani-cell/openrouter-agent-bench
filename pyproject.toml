[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openrouter-agent-bench"
version = "0.1.0"
description = "A production-grade, model-agnostic LLM benchmarking harness for OpenRouter models."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "openrouter-agent-bench contributors" }]
requires-python = ">=3.11"
keywords = ["llm", "benchmark", "evaluation", "openrouter", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.3",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sqlmodel>=0.0.19",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.scripts]
bench = "openrouter_agent_bench.cli.app:main"
bench-web = "openrouter_agent_bench.server.app:run"

[project.urls]
Homepage = "https://github.com/openrouter-agent-bench/openrouter-agent-bench"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openrouter_agent_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.mypy]
strict = true
python_version = "3.11"
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["sqlmodel.*", "yaml.*"]
ignore_missing_imports = true

# matplotlib pulls in numpy, whose current stubs use PEP 695 `type` syntax that
# mypy rejects under python_version 3.11. We never rely on their types, so skip
# following these imports entirely.
[[tool.mypy.overrides]]
module = ["matplotlib.*", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108"]

[tool.coverage.run]
source = ["src/openrouter_agent_bench"]
omit = ["src/openrouter_agent_bench/cli/*"]

id: memoize-decorator-state
suite: coding
title: Fix shared-state bug in memoize decorator
category: decorators
difficulty: 3
target_file: memoize.py
max_turns: 1
timeout_s: 300
prompt: 'You are given a small Python project with a bug or missing behavior.


  Problem: memoize stores results in one module-global cache so different decorated
  functions collide; caches must be per-function.


  Files currently in the workspace:

  - memoize.py



  '
files:
  memoize.py: "\"\"\"Memoization decorator with per-function statistics.\"\"\"\n\n\
    import functools\n\n_SHARED_CACHE: dict[tuple, object] = {}\n\n\ndef memoize(func):\n\
    \    \"\"\"Cache results by call arguments; expose .cache_info().\"\"\"\n    local_cache:\
    \ dict[tuple, object] = {}\n\n    @functools.wraps(func)\n    def wrapper(*args,\
    \ **kwargs):\n        key = (args, tuple(sorted(kwargs.items())))\n        if\
    \ key in _SHARED_CACHE:\n            wrapper.hits += 1\n            return _SHARED_CACHE[key]\n\
    \        value = func(*args, **kwargs)\n        _SHARED_CACHE[key] = value\n \
    \       wrapper.misses += 1\n        return value\n\n    wrapper.hits = 0\n  \
    \  wrapper.misses = 0\n\n    def cache_info():\n        return {\"hits\": wrapper.hits,\
    \ \"misses\": wrapper.misses, \"currsize\": len(local_cache)}\n\n    wrapper.cache_info\
    \ = cache_info\n    return wrapper\n\n\nclass CallCounter:\n    \"\"\"Counts calls\
    \ to a function; resets via reset().\"\"\"\n\n    def __init__(self, func):\n\
    \        functools.update_wrapper(self, func)\n        self.func = func\n    \
    \    self.count = 0\n\n    def reset(self):\n        self.count = 0\n\n    def\
    \ __call__(self, *args, **kwargs):\n        self.count += 1\n        return self.func(*args,\
    \ **kwargs)\n"
grader:
  type: unit_tests
  tests:
    test_memoize.py: "from memoize import CallCounter, memoize\n\n\n@memoize\ndef\
      \ add(a, b):\n    return a + b\n\n\n@memoize\ndef mul(a, b):\n    return a *\
      \ b\n\n\ndef test_caches_are_per_function():\n    assert add(2, 3) == 5\n  \
      \  assert mul(2, 3) == 6\n    info_add = add.cache_info()\n    assert info_add[\"\
      hits\"] == 0 and info_add[\"misses\"] == 1\n    assert add(2, 3) == 5\n    assert\
      \ add.cache_info()[\"hits\"] == 1\n\n\ndef test_no_cross_function_pollution():\n\
      \    add(4, 4)\n    assert mul(4, 4) == 16\n\n\ndef test_kwargs_order_irrelevant():\n\
      \    add(a=1, b=2)\n    before = add.cache_info()[\"misses\"]\n    assert add(b=2,\
      \ a=1) == 3\n    assert add.cache_info()[\"misses\"] == before\n\n\ndef test_call_counter_reset():\n\
      \    calls = CallCounter(lambda x: x * 2)\n    calls(1)\n    calls(2)\n    assert\
      \ calls.count == 2\n    calls.reset()\n    assert calls.count == 0\n"
